
name: Push Event Lab

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  show-event:
    runs-on: ubuntu-latest

    steps:
      - name: Print event
        run: echo "Push event detected!"

      - name: Print branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "Branch is $BRANCH"
