
name: Lesson 16 - AND and OR Conditions

on:
  push:
    branches:
      - main
      - 'feature/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  condition-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Show event information
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Event: $EVENT"
          echo "Branch: $BRANCH"

      - name: AND condition
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: echo "Push to main detected!"

      - name: OR condition
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        run: echo "Main branch OR manual trigger detected!"
